[project]
name = "mindscope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abd_Elhafid", email = "200634294+ABDELHAFIDaz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.4.0",
    "imbalanced-learn>=0.14.2",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
]

[project.scripts]
mindscope = "mindscope:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
